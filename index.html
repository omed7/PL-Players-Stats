<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPL Omed — Fantasy Premier League Player Intelligence</title>
    <meta name="description" content="Explore Fantasy Premier League player statistics, fixtures, form, and official fixture difficulty in one focused dashboard." />
    <link rel="canonical" href="https://fpl-omed.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FPL Omed" />
    <meta property="og:title" content="FPL Omed — Fantasy Premier League Player Intelligence" />
    <meta property="og:description" content="Explore Fantasy Premier League player statistics, fixtures, form, and official fixture difficulty in one focused dashboard." />
    <meta property="og:url" content="https://fpl-omed.vercel.app/" />
    <meta property="og:image" content="https://fpl-omed.vercel.app/assets/social/fpl-omed-social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FPL Omed — Fantasy Premier League Player Intelligence" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FPL Omed — Fantasy Premier League Player Intelligence" />
    <meta name="twitter:description" content="Explore Fantasy Premier League player statistics, fixtures, form, and official fixture difficulty in one focused dashboard." />
    <meta name="twitter:image" content="https://fpl-omed.vercel.app/assets/social/fpl-omed-social.png" />
    <meta name="twitter:image:alt" content="FPL Omed — Fantasy Premier League Player Intelligence" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ── Header ────────────────────────────────────────────────── -->
    <header class="page-header">
      <div class="header-inner">
        <div class="brand">
          <h1 class="brand-title">FPL <span>Omed</span></h1>
        </div>
        <div class="header-right">
          <div class="gw-countdown" id="gw-countdown">
            <span class="cd-label">GW<span id="gw-num">—</span></span>
            <span class="cd-sep">·</span>
            <span class="cd-time" id="cd-time">—</span>
          </div>
          <div class="account-controls hidden" id="account-controls" aria-label="Account controls">
            <span class="account-status" id="account-status" aria-live="polite">Signed out</span>
            <button type="button" class="hdr-btn account-btn" id="btn-account-sign-in">Sign in with Google</button>
            <button type="button" class="hdr-btn account-btn hidden" id="btn-account-sign-out">Sign out</button>
          </div>
          <button type="button" class="hdr-btn" id="btn-wl-open" title="Watchlist" aria-label="Open watchlist">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
              />
            </svg>
            <span class="hdr-btn-badge hidden" id="wl-hdr-badge">0</span>
          </button>
          <button
            class="hdr-btn"
            id="btn-fdr"
            title="FDR Heatmap"
            style="
              width: auto;
              padding: 0 10px;
              font-family: var(--f-d);
              font-weight: 700;
              letter-spacing: 0.05em;
              color: var(--amber);
              border-color: var(--amber-dim);
            "
          >
            FDR
          </button>
          <button
            class="hdr-btn hidden"
            id="btn-fdr-close"
            title="Back to Players"
            style="
              width: auto;
              padding: 0 10px;
              font-family: var(--f-d);
              font-weight: 700;
              letter-spacing: 0.05em;
            "
          >
            Players
          </button>
          <div class="theme-wrap">
            <button type="button" class="hdr-btn" id="btn-gear" title="Change theme" aria-label="Change theme">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
            </button>
            <div class="theme-panel hidden" id="theme-panel">
              <div class="theme-panel-title">Theme</div>
              <div class="theme-swatches">
                <button
                  class="theme-swatch active"
                  data-theme="green"
                  title="Green"
                  style="--sw: #00ff00"
                ></button>
                <button
                  class="theme-swatch"
                  data-theme="orange"
                  title="Orange"
                  style="--sw: #ff8c00"
                ></button>
                <button
                  class="theme-swatch"
                  data-theme="lightblue"
                  title="Light blue"
                  style="--sw: #00bcd4"
                ></button>
                <button
                  class="theme-swatch"
                  data-theme="yellow"
                  title="Yellow"
                  style="--sw: #fcee0a"
                ></button>
                <button
                  class="theme-swatch"
                  data-theme="softred"
                  title="Soft Red"
                  style="--sw: #ff6b6b"
                ></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- ── Summary Strip ─────────────────────────────────────────── -->
    <div class="summary-strip">
      <div class="s-item">
        <span class="s-label">Players</span>
        <span class="s-val" id="s-count">—</span>
      </div>
      <span class="s-sep">&middot;</span>
      <span class="s-updated" id="s-updated"></span>
    </div>

    <!-- ── Controls ──────────────────────────────────────────────── -->
    <div class="controls-shell">
      <div class="controls-top">
        <!-- Timeframe: Last 5 / Last 10 / Season -->
        <div class="seg-group">
          <button id="btn-last5" class="active">Last 5</button>
          <button id="btn-last10">Last 10</button>
          <button id="btn-season">Season</button>
        </div>
        <div class="seg-group pos-group" id="position-group">
          <button data-pos="All" class="active">All</button>
          <button data-pos="GK">GK</button>
          <button data-pos="DEF">DEF</button>
          <button data-pos="MID">MID</button>
          <button data-pos="FWD">FWD</button>
        </div>
        <div class="minutes-bar">
          <label id="minutes-label">Min Mins: 0</label>
          <input
            type="range"
            id="minutes-slider"
            min="0"
            max="450"
            value="0"
            step="1"
          />
          <div class="toggle-wrap">
            <span>Raw</span>
            <label class="switch"
              ><input type="checkbox" id="minutes-toggle" /><span
                class="sw-track"
              ></span
            ></label>
            <span>%</span>
          </div>
        </div>
      </div>

      <div class="controls-bottom">
        <div class="search-wrap">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="search-input" placeholder="Search player…" />
        </div>
        <div class="price-section">
          <div class="price-label-row">
            <span class="price-label"
              >Price: £<span id="price-min-disp">4.0</span>m – £<span
                id="price-max-disp"
                >15.0</span
              >m</span
            >
          </div>
          <div class="dual-range" id="price-dual-range">
            <div class="dual-range-track">
              <div class="dual-range-fill" id="price-fill"></div>
            </div>
            <input
              type="range"
              id="price-min-slider"
              class="dr-input"
              min="30"
              max="150"
              value="30"
              step="1"
            />
            <input
              type="range"
              id="price-max-slider"
              class="dr-input"
              min="30"
              max="150"
              value="150"
              step="1"
            />
          </div>
        </div>
        <div class="team-filter-section">
          <button class="team-filter-toggle-btn" id="team-filter-toggle-btn">
            <span id="team-filter-label">Filter by Team</span>
            <span class="toggle-arrow">&#9660;</span>
          </button>
          <div class="team-filter-panel" id="team-filter-panel">
            <div class="team-filter-actions">
              <button id="btn-select-all-teams">All</button>
              <span class="selection-count" id="team-selection-count"></span>
            </div>
            <div class="team-logo-grid" id="team-filter-row"></div>
          </div>
        </div>
        <section class="fpl-team-section" aria-labelledby="fpl-team-title">
          <div class="fpl-team-heading">
            <span id="fpl-team-title">FPL Team</span>
            <button type="button" class="squad-filter-btn" id="btn-my-squad" aria-pressed="false" disabled>My Squad</button>
          </div>
          <form class="fpl-team-form" id="fpl-team-form" novalidate>
            <label for="fpl-team-id">Public Team ID</label>
            <input id="fpl-team-id" name="teamId" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*" placeholder="e.g. 123456" />
            <button type="submit" id="btn-fpl-team-connect">Connect</button>
          </form>
          <p class="fpl-team-note" id="fpl-team-note">Public lookup only. Team and preferences stay on this device.</p>
          <p class="fpl-team-status" id="fpl-team-status" role="status" aria-live="polite"></p>
          <div class="fpl-team-actions hidden" id="fpl-team-actions">
            <button type="button" id="btn-fpl-team-refresh">Refresh squad</button>
            <button type="button" id="btn-fpl-team-disconnect">Disconnect</button>
          </div>
        </section>
      </div>
    </div>

    <!-- ── Main ──────────────────────────────────────────────────── -->
    <main class="main-content" id="main-content">
      <div id="error-message" class="error hidden" role="alert" aria-live="assertive">
        <p id="error-message-text">Player data is temporarily unavailable.</p>
        <button id="btn-retry-load" type="button">Try again</button>
      </div>

      <div class="table-container">
        <table id="players-table">
          <thead>
            <tr>
              <th data-sort="name" class="sticky-col" scope="col">
                <button type="button" class="sort-btn">Player <span class="sort-icon"></span></button>
              </th>
              <th data-sort="saves" id="col-saves" class="hidden" scope="col">
                <button type="button" class="sort-btn">Saves <span class="sort-icon"></span></button>
              </th>
              <th data-sort="points" scope="col"><button type="button" class="sort-btn">Pts <span class="sort-icon"></span></button></th>
              <!-- Season-only columns -->
              <th data-sort="goals" id="col-goals" class="hidden" scope="col">
                <button type="button" class="sort-btn">Goals <span class="sort-icon"></span></button>
              </th>
              <th data-sort="assists" id="col-assists" class="hidden" scope="col">
                <button type="button" class="sort-btn">Ast <span class="sort-icon"></span></button>
              </th>
              <th data-sort="clean_sheets" id="col-cs" class="hidden" scope="col">
                <button type="button" class="sort-btn">CS <span class="sort-icon"></span></button>
              </th>
              <th data-sort="ppg" id="col-ppg" class="hidden" scope="col">
                <button type="button" class="sort-btn">PPG <span class="sort-icon"></span></button>
              </th>
              <!-- Standard columns -->
              <th data-sort="xG" id="col-xg" class="active-sort desc" scope="col" aria-sort="descending">
                <button type="button" class="sort-btn">xG <span class="sort-icon">&#9660;</span></button>
              </th>
              <th data-sort="xA" id="col-xa" scope="col">
                <button type="button" class="sort-btn">xA <span class="sort-icon"></span></button>
              </th>
              <th data-sort="xGI" id="col-xgi" scope="col">
                <button type="button" class="sort-btn">xGI <span class="sort-icon"></span></button>
              </th>
              <th data-sort="influence" id="col-influence" scope="col">
                <button type="button" class="sort-btn">Influence <span class="sort-icon"></span></button>
              </th>
              <th data-sort="creativity" id="col-creativity" scope="col">
                <button type="button" class="sort-btn">Creativity <span class="sort-icon"></span></button>
              </th>
              <th data-sort="threat" id="col-threat" scope="col">
                <button type="button" class="sort-btn">Threat <span class="sort-icon"></span></button>
              </th>
              <th data-sort="ict" id="col-ict" scope="col">
                <button type="button" class="sort-btn">ICT <span class="sort-icon"></span></button>
              </th>
              <th data-sort="defcon" id="col-defcon" scope="col">
                <button type="button" class="sort-btn">DefCon <span class="sort-icon"></span></button>
              </th>
              <th data-sort="bps" scope="col"><button type="button" class="sort-btn">BPS <span class="sort-icon"></span></button></th>
              <th data-sort="bonus" scope="col"><button type="button" class="sort-btn">Bonus <span class="sort-icon"></span></button></th>
              <th data-sort="value" title="Points per £m" scope="col">
                <button type="button" class="sort-btn">Pts/£m <span class="sort-icon"></span></button>
              </th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="pagination">
        <button id="btn-prev" disabled>&#8592; Prev</button>
        <span id="page-info">Page 1 of 1</span>
        <button id="btn-next" disabled>Next &#8594;</button>
      </div>
    </main>

    <!-- ── FDR Heatmap Container ──────────────────────────────────── -->
    <main
      class="main-content hidden"
      id="fdr-container"
      style="margin-top: 10px"
    >
      <div
        class="fdr-controls"
        style="display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap"
      >
        <button
          class="fdr-sort-btn active"
          id="btn-fdr-sort-avg"
          style="
            font-family: var(--f-d);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 8px 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-2);
            cursor: pointer;
            transition: all 0.13s;
          "
        >
          Sort: Average FDR
        </button>
        <button
          class="fdr-sort-btn"
          id="btn-fdr-sort-alpha"
          style="
            font-family: var(--f-d);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 8px 16px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-2);
            cursor: pointer;
            transition: all 0.13s;
          "
        >
          Sort: Alphabetical
        </button>
      </div>
      <div class="table-container">
        <table id="fdr-table">
          <thead>
            <tr id="fdr-thead-row">
              <th class="sticky-col">Team</th>
              <!-- GW columns injected dynamically -->
            </tr>
          </thead>
          <tbody id="fdr-table-body"></tbody>
        </table>
      </div>
    </main>

    <!-- ── Watchlist Drawer ───────────────────────────────────────── -->
    <div class="wl-backdrop hidden" id="wl-backdrop" aria-hidden="true"></div>
    <aside class="wl-drawer" id="wl-drawer" role="dialog" aria-modal="true" aria-labelledby="wl-drawer-title" aria-hidden="true" tabindex="-1" inert>
      <div class="wl-drawer-hdr">
        <div class="wl-drawer-title" id="wl-drawer-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
            />
          </svg>
          Watchlist
          <span class="wl-count-pill" id="wl-drawer-count">0</span>
        </div>
        <div class="wl-drawer-actions">
          <button type="button" id="btn-wl-only" class="wl-only-btn">Only ★</button>
          <button type="button" id="btn-wl-clear" class="wl-clr-btn">Clear</button>
          <button type="button" id="btn-wl-close" class="wl-x-btn" aria-label="Close watchlist">&#10005;</button>
        </div>
      </div>
      <div class="wl-drawer-body" id="wl-drawer-body">
        <div class="wl-empty" id="wl-empty">
          No players starred yet.<br />Click ★ on any player row.
        </div>
      </div>
    </aside>

    <!-- ── Compare Bar + Modal ────────────────────────────────────── -->
    <div class="cmp-bar hidden" id="cmp-bar">
      <span class="cmp-bar-label">Comparing</span>
      <div class="cmp-bar-players" id="cmp-bar-players"></div>
      <button type="button" class="cmp-bar-open-btn" id="btn-cmp-open">Open &#8594;</button>
      <button type="button" class="cmp-bar-clear-btn" id="btn-cmp-clear" aria-label="Clear comparison">&#10005;</button>
    </div>
    <div class="cmp-overlay hidden" id="cmp-overlay" aria-hidden="true">
      <div class="cmp-modal" role="dialog" aria-modal="true" aria-labelledby="cmp-modal-title" tabindex="-1">
        <div class="cmp-modal-hdr">
          <span class="cmp-modal-title" id="cmp-modal-title">Player Comparison</span>
          <button type="button" class="cmp-modal-close" id="btn-cmp-modal-close" aria-label="Close player comparison">
            &#10005;
          </button>
        </div>
        <div class="cmp-modal-body" id="cmp-modal-body"></div>
      </div>
    </div>

    <!-- ── Player Detail Modal (Feature 6) ───────────────────────── -->
    <div class="pd-overlay hidden" id="pd-overlay" aria-hidden="true">
      <div class="pd-modal" role="dialog" aria-modal="true" aria-label="Player details" tabindex="-1">
        <button type="button" class="pd-close" id="btn-pd-close" aria-label="Close player details">&#10005;</button>
        <div class="pd-body" id="pd-body"></div>
      </div>
    </div>

    <!-- view counter -->
    <div
      style="
        text-align: center;
        padding: 20px;
        display: flex;
        justify-content: center;
      "
    >
      <img
        src="https://api.visitorbadge.io/api/visitors?path=https%3A%2F%2Ffpl-omed.vercel.app%2F&label=VIEWS&countColor=%2300ff85&style=flat"
        alt="FPL Omed Views"
        onerror="this.style.display = 'none'"
      />
    </div>

    <script src="fixture_utils.js"></script>
    <script src="schema_utils.js"></script>
    <script src="history_utils.js"></script>
    <script src="persistence_utils.js"></script>
    <script src="ui_state_utils.js"></script>
    <script src="dashboard_data_utils.js"></script>
    <script src="render_utils.js"></script>
  <script src="player_table_utils.js"></script>
  <script src="player_query_utils.js"></script>
  <script src="fdr_view_utils.js"></script>
  <script src="comparison_view_utils.js"></script>
  <script src="player_detail_chart_utils.js"></script>
  <script src="watchlist_view_utils.js"></script>
  <script src="player_detail_snapshot_utils.js"></script>
  <script src="public_data_config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="account_sync_utils.js"></script>
    <script src="account_auth.js"></script>
    <script src="account_sync.js"></script>
    <script src="team_profile_utils.js"></script>
    <script src="team_data_loader.js"></script>
    <script src="public_data_loader.js"></script>
    <script src="script.js"></script>
  </body>
</html>
