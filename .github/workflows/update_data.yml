name: Update FPL Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'fpl_fetcher.py'

permissions:
  contents: read

# The workflow writes the shared public snapshot and players.json. Queue a later
# schedule, dispatch, or fetcher-triggered run instead of overlapping or cancelling
# a publication that has already passed validation.
concurrency:
  group: fpl-data-publication
  cancel-in-progress: false

jobs:
  update-data:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           github.event_name == 'push') }}
    environment: fpl-data-production
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          npm ci

      - name: Run data-contract tests
        run: npm test

      - name: Check publication credential
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo '::error::Missing SUPABASE_SERVICE_ROLE_KEY in fpl-data-production; publication cannot proceed.' >&2
            exit 1
          fi

      - name: Run FPL fetcher script
        run: python fpl_fetcher.py

      - name: Publish validated snapshot to Supabase
        env:
          SUPABASE_URL: https://ghowrpjnoraohyjpmvuo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python supabase_publisher.py

      - name: Commit and push changed data
        run: |
          git config --global user.name 'omed7'
          git config --global user.email 'omed7@users.noreply.github.com'
          git add players.json
          if git diff --cached --quiet; then
            echo 'No player-data changes to commit.'
            exit 0
          fi
          git commit -m "Auto-update FPL player data"
          git push
