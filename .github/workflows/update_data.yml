name: Update FPL Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'fpl_fetcher.py'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          npm ci

      - name: Run data-contract tests
        run: npm test

      - name: Run FPL fetcher script
        run: python fpl_fetcher.py

      - name: Commit and push changed data
        run: |
          git config --global user.name 'omed7'
          git config --global user.email 'omed7@users.noreply.github.com'
          git add players.json
          if git diff --cached --quiet; then
            echo 'No player-data changes to commit.'
            exit 0
          fi
          git commit -m "Auto-update FPL player data"
          git push
